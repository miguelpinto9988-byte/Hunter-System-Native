name: Auditoria temporal de iconos Agenda Clara
on:
  push:
    branches:
      - feature/agenda-clara-png-rendering-parity
    paths:
      - "tools/audit_agenda_icon_loading.py"
      - ".github/workflows/icon-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar recursos e invocaciones de iconos en fuentes Agenda Clara
        run: python3 tools/audit_agenda_icon_loading.py
