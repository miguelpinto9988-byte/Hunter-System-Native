name: Monarca progression rules — Kotlin tests

on:
  push:
    paths:
      - "app/src/main/java/com/huntersystem/app/*.kt"
      - "app/src/test/java/com/huntersystem/app/*.kt"
      - ".github/workflows/monarca-progress-tests.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/huntersystem/app/*.kt"
      - "app/src/test/java/com/huntersystem/app/*.kt"
      - ".github/workflows/monarca-progress-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Android Kotlin and deterministic progression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests without release assets or signing
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
