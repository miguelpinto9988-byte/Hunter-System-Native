name: Previsualizacion real Hunter System en Android
on:
  push:
    branches:
      - preview/v43-12-pixel-icons-real-device
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-screenshot:
    name: Capturar pantalla real del APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Permitir aceleracion KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capturar imagen nativa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p preview-android
            python3 tools/download_monarch_boss_originals.py
            bash ./gradlew :app:assembleDebug --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            cat > preview-android/perfil-demo.json <<'JSON'
            {"profile":{"name":"Cazador","age":18,"height":170,"weight":70,"gender":"male","finalGoal":"Mantener constancia semanal","goalGroup":"build","finalTarget":"strength","experience":"beginner","weekPlan":["rest","train","rest","train","rest","train","rest"],"weekFocus":["upper","upper","upper","lower","upper","core","upper"],"minutes":20,"frequency":3},"logs":{},"cycles":[]}
            JSON
            adb push preview-android/perfil-demo.json /data/local/tmp/hunter-preview-profile.json
            adb shell run-as com.huntersystem.app mkdir -p files\n            adb shell run-as com.huntersystem.app sh -c "'cat /data/local/tmp/hunter-preview-profile.json > files/hunter-system-native.json'"
            adb shell pm grant com.huntersystem.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.huntersystem.app/.MainActivity
            sleep 22
            adb exec-out screencap -p > preview-android/01-app-recién-abierta.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml preview-android/ui-dump.xml || true
            adb shell input tap 540 2180
            sleep 4
            adb exec-out screencap -p > preview-android/02-interaccion.png
            adb shell uiautomator dump /sdcard/window2.xml || true
            adb pull /sdcard/window2.xml preview-android/ui-dump2.xml || true
            adb shell input swipe 540 1700 540 600 600
            sleep 3
            adb exec-out screencap -p > preview-android/03-scroll.png
            adb logcat -d -t 1000 -s AndroidRuntime:E > preview-android/errores-app.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Capturas-Reales-Hunter-System-Android
          path: preview-android/
          retention-days: 5
