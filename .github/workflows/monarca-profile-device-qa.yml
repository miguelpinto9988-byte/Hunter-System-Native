name: Monarca Eclipse - Perfil Android dispositivo QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/com/huntersystem/app/ComposeProfile.kt"
      - "app/src/main/java/com/huntersystem/app/Profile.kt"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/monarca-profile-device-qa.yml"
permissions:
  contents: read
jobs:
  profile-android:
    name: Comprobar el formulario renderizado en Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Permitir aceleracion de emulador
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Ejecutar perfil Compose en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/test_profile_android.sh
      - name: Guardar informes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monarca-perfil-android-informes
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/qa/
          if-no-files-found: ignore
          retention-days: 14
