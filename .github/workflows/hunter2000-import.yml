name: Incorporar recursos Hunter 2000 a la rama

on:
  push:
    branches:
      - integration/hunter-v43-compose-2000
    paths:
      - '.hunter2000/source/hunter2000-assets.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunter2000-expand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    name: Importar 2000 SVG + 800 fichas y confirmar los archivos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obtener la rama de integración
        uses: actions/checkout@v4
        with:
          ref: integration/hunter-v43-compose-2000
          fetch-depth: 0
          persist-credentials: true

      - name: Verificar y desplegar el archivo de recursos
        shell: bash
        run: |
          set -euo pipefail
          ASSET='.hunter2000/source/hunter2000-assets.tar.xz'
          test -f "$ASSET"
          printf '%s  %s\n' 'c661292ab8df9aefa8ce234325b0b7ca3a2dc1da9f32f211399cfc339c5b6e71' "$ASSET" | sha256sum -c -
          python3 - <<'PY'
          import tarfile
          p='.hunter2000/source/hunter2000-assets.tar.xz'
          prefix='app/src/main/assets/'
          with tarfile.open(p,'r:xz') as t:
              members=t.getmembers()
              assert len(members)==2003, len(members)
              assert all(m.isfile() and m.name.startswith(prefix) and not m.name.startswith('/') and '..' not in m.name.split('/') for m in members)
              assert sum(m.name.endswith('.svg') for m in members)==2000
              t.extractall('.',filter='data')
          PY
          python3 tools/check_hunter2000_complete.py

      - name: Confirmar los recursos en GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/demos30/ \
            app/src/main/assets/catalog-hunter2000-extra.json \
            app/src/main/assets/hunter2000-manifest.json \
            app/src/main/assets/hunter2000-qa-status.json
          if git diff --cached --quiet; then
            echo 'Los archivos ya estaban integrados, no es necesario crear un commit.'
          else
            git commit -m 'Incorporar los 2000 SVG originales y 800 fichas Hunter 2000'
            git push origin HEAD:integration/hunter-v43-compose-2000
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas Kotlin Compose con catálogo de 2000
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Recuperar firma de APK desde secrets
        shell: bash
        env:
          HUNTER_KEYSTORE_BASE64: ${{ secrets.HUNTER_KEYSTORE_BASE64 }}
          HUNTER_STORE_PASSWORD: ${{ secrets.HUNTER_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HUNTER_KEYSTORE_BASE64"
          test -n "$HUNTER_STORE_PASSWORD"
          printf '%s' "$HUNTER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hunter-system-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/hunter-system-release.p12" -storetype PKCS12 -storepass "$HUNTER_STORE_PASSWORD"

      - name: Compilar APK final integrada
        env:
          HUNTER_KEYSTORE: ${{ runner.temp }}/hunter-system-release.p12
          HUNTER_STORE_PASSWORD: ${{ secrets.HUNTER_STORE_PASSWORD }}
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Confirmar recursos dentro de la APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          apk=next(Path('app/build/outputs/apk/release').glob('*.apk'))
          with ZipFile(apk) as z:
              names=set(z.namelist())
              svg=[x for x in names if x.startswith('assets/demos30/') and x.endswith('.svg')]
              extra=json.loads(z.read('assets/catalog-hunter2000-extra.json'))
              assert len(svg)==2000, len(svg)
              assert len(extra)==800, len(extra)
              assert all(e.get('approvedForAutoplan') is False for e in extra)
              print('APK completa: 2000 SVG y 800 fichas, auto-plan bloqueado')
          PY

      - name: Publicar APK Hunter 2000
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-System-V43-2000-Ejercicios-Preview-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
