name: Hunter120 - exportar demos a MP4 de 120 fotogramas
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs separados por coma. Vacio usa start/count."
        required: false
        type: string
        default: ""
      start:
        description: "Indice de inicio de lote"
        type: number
        default: 0
      count:
        description: "Cantidad de videos para este lote"
        type: number
        default: 20
  push:
    branches:
      - integration/hunter-v43-compose-2000
    paths:
      - tools/hunter120_export.py
      - .github/workflows/hunter120-export.yml
permissions:
  contents: read
jobs:
  export:
    name: Exportar MP4 H264 verificados, sin alterar los SVG
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de render
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "cairosvg>=2.7,<3" "lxml>=5,<7" "Pillow>=10,<13"
          ffmpeg -version | head -n 1
      - name: Comprobar inventario de 2000 SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path("app/src/main/assets/demos30").glob("*.svg"))
          assert len(files)==2000, f"Se esperaban 2000 y hay {len(files)}"
          assert len({f.stem for f in files})==2000
          print("2000 SVG comprobados")
          PY
      - name: Generar lote y verificar 120 fotogramas con ffprobe
        env:
          IDS: ${{ inputs.ids }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunter120"
          if [ "$TRIGGER" = "push" ]; then
            python3 tools/hunter120_export.py --source app/src/main/assets/demos30 --output "$RUNNER_TEMP/hunter120" --ids squat,pushup,hx_upper_0001 --size 320
          elif [ -n "$IDS" ]; then
            python3 tools/hunter120_export.py --source app/src/main/assets/demos30 --output "$RUNNER_TEMP/hunter120" --ids "$IDS" --size 360
          else
            python3 tools/hunter120_export.py --source app/src/main/assets/demos30 --output "$RUNNER_TEMP/hunter120" --start "$START" --count "$COUNT" --size 360
          fi
      - name: Publicar lote de MP4 y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: Hunter120-MP4-Originales-Por-Lote
          path: ${{ runner.temp }}/hunter120/*
          if-no-files-found: error
          retention-days: 14
