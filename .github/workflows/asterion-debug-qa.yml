name: Hunter System Asterion - APK debug para QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/asterion-debug-qa.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    name: Pruebas Android y APK debug sin arte remoto
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar catálogo local y 2000 SVG
        run: python3 tools/check_hunter2000_complete.py
      - name: Pruebas locales, Kotlin y Robolectric
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
      - name: Compilar APK debug sin descargar imágenes promocionales de terceros
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Publicar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-System-Asterion-Monarca-Eclipse-debug-QA
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
