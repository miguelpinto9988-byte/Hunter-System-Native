name: Capturas reales Monarca Eclipse 134
on:
  push:
    branches: [qa/capturas-interfaz-134]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar aceleración del emulador
        run: sudo chmod 666 /dev/kvm || true
      - name: Ejecutar la interfaz real en Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/capture_main_ui_134.sh
      - name: Publicar capturas PNG y jerarquías XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-134-capturas-reales
          path: app/build/ui-captures/
          if-no-files-found: error
          retention-days: 14
