name: Monarca - pruebas de planificación única
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/com/huntersystem/app/monarca/**"
      - "app/src/main/java/com/huntersystem/app/Monarca*.kt"
      - "app/src/main/java/com/huntersystem/app/NativeStore.kt"
      - "app/src/main/java/com/huntersystem/app/Monarch*.kt"
      - "app/src/test/java/com/huntersystem/app/monarca/**"
      - ".github/workflows/monarca-engine.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/monarca-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-tests:
    name: Kotlin compile + Monarca tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run isolated rules tests
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests "com.huntersystem.app.planning.MonarchPlanningRulesTest" --tests "com.huntersystem.app.MonarchPlanningPersistenceTest"
