# Hunter System V43.12 · Igris, Rey Hormiga y Baran investigados + SVG 2000
name: Compilar Hunter System Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-apk.yml"
      - "tools/**"

permissions:
  contents: read

jobs:
  build:
    name: APK release firmada
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then
            echo "::error::No se encontro sdkmanager en $SDK_MANAGER"
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma desde GitHub Secrets
        env:
          HUNTER_KEYSTORE_BASE64: ${{ secrets.HUNTER_KEYSTORE_BASE64 }}
          HUNTER_STORE_PASSWORD: ${{ secrets.HUNTER_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HUNTER_KEYSTORE_BASE64" || -z "$HUNTER_STORE_PASSWORD" ]]; then
            echo "::error::Configura los secretos HUNTER_KEYSTORE_BASE64 y HUNTER_STORE_PASSWORD"
            exit 1
          fi
          echo "$HUNTER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hunter-system-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/hunter-system-release.p12" -storetype PKCS12 -storepass "$HUNTER_STORE_PASSWORD" > /dev/null

      - name: Descargar arte promocional original de jefes (Solo Leveling)
        run: python3 tools/download_monarch_boss_originals.py

      - name: Quitar fondos de sombras y validar fondos planos
        run: python3 tools/check_plain_backgrounds.py

      - name: Verificar biblioteca Pixel Art PNG RGBA
        run: python3 tools/check_pixel_icons.py

      - name: Comprobar ausencia de miniaturas
        run: python3 tools/verificar_sin_miniaturas.py

      - name: Auditoria Monarca V42 fase 01
        run: python3 tools/check_v42_phase1.py

      - name: Auditoria Monarca V42 fase 02
        run: python3 tools/check_v42_phase2.py

      - name: Auditoria Monarca V42 fase 03
        run: python3 tools/check_v42_phase3.py

      - name: Auditoria Monarca V42 fase 04
        run: python3 tools/check_v42_phase4.py

      - name: Auditoria Monarca V42 fase 05
        run: python3 tools/check_v42_phase5.py

      - name: Auditoria Monarca V42 fase 06
        run: python3 tools/check_v42_phase6.py

      - name: Auditoria Monarca V42 fase 07
        run: python3 tools/check_v42_phase7.py

      - name: Auditoria Monarca V42 fase 08
        run: python3 tools/check_v42_phase8.py

      - name: Auditoria Monarca V42 fase 09
        run: python3 tools/check_v42_phase9.py

      - name: Auditoria Monarca V42 fase 10
        run: python3 tools/check_v42_phase10.py

      - name: Validar integración V43
        run: python3 tools/check_v43_fusion.py

      - name: Comprobar navegación inferior sin barra lateral
        run: python3 tools/check_bottom_navigation_only.py

      - name: Comprobar inicio y guardado de perfil independiente
        run: python3 tools/check_standalone_profile.py

      - name: Comprobar estado de recursos Hunter 2000
        run: python3 tools/import_hunter2000_assets.py --check

      - name: Comprobar integridad de 2000 SVG y ausencia de Rive
        run: python3 tools/check_hunter2000_complete.py

      - name: Crear matriz de inspección SVG (todas las filas pendientes)
        run: python3 tools/generate_svg_qa_queue.py --output "$RUNNER_TEMP/hunter-svg-2000-qa-pendiente.csv"

      - name: Validar motor de alarmas V43.12
        run: python3 tools/check_hunter_alarms.py

      - name: Verificar perfil V43.12 de tres etapas
        run: python3 tools/check_profile_redesign_v43.py

      - name: Pruebas Kotlin y Compose
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Compilar APK release firmada
        env:
          HUNTER_KEYSTORE: ${{ runner.temp }}/hunter-system-release.p12
          HUNTER_STORE_PASSWORD: ${{ secrets.HUNTER_STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verificar 2000 SVG en la APK y ausencia de Rive
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,json,hashlib
          apk=next(pathlib.Path('app/build/outputs/apk/release').glob('*.apk'))
          source=pathlib.Path('app/src/main/assets')
          records=json.loads((source/'catalog.json').read_text())+json.loads((source/'catalog-hunter2000-extra.json').read_text())
          sha=json.loads((source/'hunter2000-qa-status.json').read_text())['SHA256_by_asset']
          expected={'assets/'+entry['demoPath30'] for entry in records}
          with zipfile.ZipFile(apk) as z:
            names=z.namelist()
            svgs={p for p in names if p.startswith('assets/demos30/') and p.endswith('.svg')}
            assert len(svgs)==2000 and svgs==expected,(len(svgs),len(expected))
            assert not [p for p in names if p.endswith('.riv') or 'librive-android.so' in p], 'Persisten archivos Rive'
            for path in svgs:
              raw=z.read(path)
              assert hashlib.sha256(raw).hexdigest()==sha[path.removeprefix('assets/')],path
            artwork='assets/monarch_splash_background.webp'
            assert artwork in names,'Falta fondo animado de carga'
            data=z.read(artwork)
            assert data[:4]==b'RIFF' and data[8:12]==b'WEBP','WebP splash corrupto'
            print('Fondo Monarca empaquetado:',len(data),'bytes')
            for boss in ('guardia','fortaleza','trono'):
              asset=f'assets/monarch-boss-original/{boss}.jpg'
              assert asset in names,f'Falta imagen promocional original: {asset}'
              raw=z.read(asset)
              assert len(raw)>10000 and raw[:3]==b'\xff\xd8\xff',f'JPEG original invalido: {boss}'
              assert f'assets/monarch-boss/{boss}.svg' not in names,'Persisten ilustraciones SVG rediseñadas'
            print('3 imágenes de jefes descargadas y empaquetadas sin rediseño')
            assert not any(p.startswith('assets/hunter-png/wallpapers/') for p in names),'Persisten fondos PNG de sombras'
            assert not any(p.startswith('assets/realm-art/') for p in names),'Persisten fondos SVG antiguos'
            assert not any(p.startswith('assets/hunter-png/icons/') for p in names),'Persisten iconos PNG antiguos'
            png_sources=list(pathlib.Path('app/src/main/res/drawable-nodpi').glob('hunter_pixel_*.png'))
            assert len(png_sources)==49,('Cantidad de iconos PNG',len(png_sources))
            # AAPT2 renombra los ficheros de recursos; no conservar sus nombres
            # originales dentro de la APK es comportamiento Android esperado.
            compiled_pngs=[p for p in names if p.startswith('res/') and p.endswith('.png')]
            assert len(compiled_pngs)>=49,('Recursos PNG insuficientes en la APK',len(compiled_pngs))
            assert all(p.stat().st_size>0 for p in png_sources)
            print('49 fuentes PNG Pixel Art; recursos raster Android presentes en APK:',len(compiled_pngs))
            extra=json.loads(z.read('assets/catalog-hunter2000-extra.json'))
            assert len(extra)==800 and all(x.get('approvedForAutoplan') is False and x.get('autoProgressionApproved') is False for x in extra)
            print('APK verificada: 2000 SVG íntegros, 0 Rive, 800 fichas sin QA ni planificación automática')
          PY

      - name: Publicar matriz de QA pendiente (no es certificacion)
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-System-V43-SVG-2000-QA-Pendiente
          path: ${{ runner.temp }}/hunter-svg-2000-qa-pendiente.csv
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-System-V43-12-Monarca-Eclipse-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
