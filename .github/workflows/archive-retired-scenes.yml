name: Archivar redisenos antiguos y limpiar sus ramas
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-retired-scenes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-and-prune:
    name: Proteger commits exclusivos antes de borrar ramas antiguas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear etiquetas de archivo verificadas y eliminar ramas retiradas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          pairs=(
            "redesign/v39-eclipse-aurora-ceniza-amanecer|archive/retired-scenes/v39-eclipse-aurora-ceniza-amanecer"
            "redesign/v40-premium-compose-20261024|archive/retired-scenes/v40-premium-compose-20261024"
            "redesign/v41-full-concept-20261024|archive/retired-scenes/v41-full-concept-20261024"
            "feature/agenda-clara-png-rendering-parity|archive/retired-scenes/agenda-clara-png-parity"
          )
          total=0
          for item in "${pairs[@]}"; do
            branch="${item%%|*}"
            tag="${item#*|}"
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "SKIP branch absent: $branch"
              continue
            fi
            sha="$(git rev-parse "refs/remotes/origin/$branch")"
            existing="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
            if [[ -z "$existing" ]]; then
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
              existing="$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')"
            fi
            if [[ "$existing" != "$sha" ]]; then
              echo "::error::Tag $tag does not match $branch, refusing to delete"
              exit 21
            fi
            echo "BACKUP verified: $branch -> $tag ($sha)"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "DELETED obsolete scene branch: $branch"
            total=$((total + 1))
          done
          echo "Archived and removed $total obsolete visual design branches." >> "$GITHUB_STEP_SUMMARY"
