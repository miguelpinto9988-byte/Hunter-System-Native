name: Monarca Eclipse - APK debug QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monarca-debug-qa.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    name: Pruebas Android y APK debug sin arte remoto
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar catálogo local y 2000 SVG
        run: python3 tools/check_hunter2000_complete.py
      - name: Compilar APK debug sin descargar imágenes promocionales de terceros
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verificar los 2000 SVG y excluir recursos 3D de la APK
        run: |
          python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          src = Path("app/src/main/assets")
          rows = json.loads((src/"catalog.json").read_text()) + json.loads((src/"catalog-hunter2000-extra.json").read_text())
          paths = {"assets/"+row["demoPath30"] for row in rows}
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              names = set(apk.namelist())
              assert len(rows) == len(paths) == 2000
              assert {p for p in names if p.startswith("assets/demos30/") and p.endswith(".svg")} == paths
              assert not any(p.startswith("assets/exercise-3d/") for p in names)
              for path in paths:
                  assert hashlib.sha256(apk.read(path)).digest() == hashlib.sha256((src/path.removeprefix("assets/")).read_bytes()).digest(), path
          PY
      - name: Publicar APK de pruebas (QA técnica pendiente)
        uses: actions/upload-artifact@v4
        with:
          name: Hunter-System-Monarca-Eclipse-2D-2000-debug-QA
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Pruebas locales, Kotlin y Robolectric
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
