name: Vista previa visual Monarca 134
on:
  push:
    branches: [qa/redisenio-paneles-134]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Auditar catálogo intacto
        run: python3 tools/check_hunter2000_complete.py
      - name: Compilar vista previa
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Auditar APK
        run: python3 tools/check_hunter2000_complete.py --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Monarca-134-redisenio-visual-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Pruebas existentes
        run: bash gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar aceleración de emulador
        run: sudo chmod 666 /dev/kvm || true
      - name: Capturar interfaz en Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/capture_preview_panels.sh
      - name: Publicar capturas y diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Monarca-134-redisenio-capturas
          path: app/build/ui-captures/
          if-no-files-found: error
          retention-days: 14
